name: press_gang

services:
  api:
    stdin_open: true
    tty: true
    build: api
    depends_on:
      - db
    ports:
      - '3000:3000'
    volumes:
      - ./api:/usr/src/press_gang_api
    environment:
      # rails configs
      RAILS_ENV: development
      POSTGRES_HOST: db
      # DB configs
      POSTGRES_DB: press_gang_db
      POSTGRES_USER: press_gang_db_user
      POSTGRES_PASSWORD: press_gang_db_password_dev!
      # CORS
      CLIENT_ORIGIN: http://localhost:5173
  client:
    build: client
    ports:
      - '5173:5173'
    volumes:
      - ./client:/usr/src/press_gang_client
    environment:
      # for client api service
      VITE_DOMAIN_NAME: localhost:3000
      VITE_API_HOST: http://localhost:3000
  db:
    image: postgres
    volumes:
      - postgres:/var/lib/postgresql/data
    ports:
      - '5432:5432'
    environment:
      POSTGRES_DB: press_gang_db
      POSTGRES_USER: press_gang_db_user
      POSTGRES_PASSWORD: press_gang_db_password_dev!

volumes:
  postgres:
