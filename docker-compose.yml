name: press_gang

services:
  api:
    stdin_open: true
    tty: true
    build: api
    depends_on:
      db:
        condition: service_healthy
    ports:
      - '3000:3000'
    volumes:
      - ./api:/usr/src/press_gang_api
    environment:
      # rails configs
      RAILS_ENV: development
      POSTGRES_HOST: db
      # DB configs
      POSTGRES_DB: press_gang_db # must be different from following line!
      POSTGRES_TEST_DB: press_gang_test # must be different from previous line!
      POSTGRES_USER: press_gang_db_user
      POSTGRES_PASSWORD: press_gang_db_password_dev!
      # CORS
      CLIENT_ORIGIN: http://localhost:5173
  client:
    build: client
    ports:
      - '5173:5173'
    volumes:
      - ./client:/usr/src/press_gang_client
    environment:
      # for client api service
      VITE_DOMAIN_NAME: localhost:3000
      VITE_API_HOST: http://localhost:3000
  db:
    image: postgres
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres:/var/lib/postgresql
    ports:
      - '5432:5432'
    environment:
      POSTGRES_DB: press_gang_db
      POSTGRES_USER: press_gang_db_user
      POSTGRES_PASSWORD: press_gang_db_password_dev!

volumes:
  postgres:
