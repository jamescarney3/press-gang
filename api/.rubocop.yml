# Offense count: 19 as of 2026-9-11
# NB: turn this back on if including rdoc
# Configuration parameters: AllowedConstants.
Style/Documentation:
  Enabled: false

# db/schema.rb is a generated file, and migrations are mostly generated;
# don't worry about these
AllCops:
  Exclude:
    - "db/schema.rb"
    - "db/migrate/*"
