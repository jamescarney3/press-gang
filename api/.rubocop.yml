inherit_from: .rubocop_todo.yml

# Offense count: 19 as of 2026-9-11
# NB: turn this back on if including rdoc
# Configuration parameters: AllowedConstants.
Style/Documentation:
  Enabled: false

# db/schema.rb is a generated file, don't worry about this
Style/NumericLiterals:
  Exclude:
    - "db/schema.rb"

# Offense count: 1 as of 2026-9-11
# This cop supports safe autocorrection (--autocorrect).
# NB: was this generated? look into if bored
Style/RedundantFileExtensionInRequire:
  Exclude:
    - "bin/ci"
