name: press_gang_production

services:
  api:
    extends:
      file: docker-compose.yml
      service: api
    build:
      target: production
    environment:
      # rails configs
      RAILS_ENV: production
      RAILS_MASTER_KEY: ${RAILS_MASTER_KEY:?error}
      POSTGRES_HOST: db
      # DB configs
      POSTGRES_DB: ${POSTGRES_DB:?error}
      POSTGRES_USER: ${POSTGRES_USER:?error}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?error}
      # cors
      CLIENT_ORIGIN: ${CLIENT_ORIGIN:?error}
  client:
    extends:
      file: docker-compose.yml
      service: client
    build:
      target: production
      args:
        # for client api service
        VITE_API_HOST: ${VITE_API_HOST:?error}
    environment:
      # production only config - interpolated into nginx conf to serve build artifacts
      CLIENT_PORT: ${CLIENT_PORT:?error}
  db:
    extends:
      file: docker-compose.yml
      service: db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?error}
      POSTGRES_USER: ${POSTGRES_USER:?error}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?error}

volumes:
  postgres:
